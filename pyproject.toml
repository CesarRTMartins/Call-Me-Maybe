[project]
name = "call-me-maybe"
version = "1.1"
description = "Introduction to function calling in LLMs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "llm-sdk",
    "accelerate>=1.14.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.0",
]

[tool.uv]
package = true

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/llm_sdk"
exclude = ["llm_sdk/"]

[[tool.mypy.overrides]]
module = ["llm_sdk.*"]
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "llm_sdk"]
